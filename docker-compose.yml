services:

  nginx:
    image: nginx:latest
    container_name: invoicemate-nginx

    ports:
      - "8080:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - frontend
      - backend

  frontend:
    build: ./frontend
    container_name: invoicemate-frontend

    expose:
      - "5173"

    depends_on:
      - backend

  backend:
    build: ./backend
    container_name: invoicemate-backend

    expose:
      - "5000"

    depends_on:
      - db

  db:
    image: postgres:15
    container_name: invoicemate-db

    restart: always

    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: invoicedb

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
